<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多步表单 · 分支 / 草稿 / 异步校验</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { border: 1px solid #8884; border-radius: 8px; margin-bottom: 1rem; }
    label { display: block; margin: .6rem 0 .2rem; font-size: .9rem; }
    input, select { width: 100%; padding: .45rem; box-sizing: border-box; }
    .err { color: #d33; font-size: .8rem; min-height: 1em; }
    .pending { color: #e80; font-size: .8rem; }
    .stale { color: #e80; }
    .row { display: flex; gap: .5rem; margin-top: 1rem; }
    button { padding: .5rem 1rem; }
    #steps { font-size: .8rem; opacity: .7; margin-bottom: 1rem; }
    #share { width: 100%; font-size: .7rem; word-break: break-all; }
    #status { font-size: .8rem; opacity: .7; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>注册表单</h1>
  <div id="steps"></div>
  <form id="form" onsubmit="return false">
    <fieldset id="fields"><legend id="step-title"></legend></fieldset>
    <div class="row">
      <button id="back" type="button">上一步</button>
      <button id="next" type="button">下一步</button>
      <button id="shareBtn" type="button">生成分享链接</button>
      <button id="reset" type="button">清空草稿</button>
    </div>
  </form>
  <p id="status"></p>
  <textarea id="share" rows="3" readonly placeholder="分享 token 会显示在这里"></textarea>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
